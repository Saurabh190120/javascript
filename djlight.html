<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <h1>DJ LIGHT</h1>
    <div id="dj">

    </div>
    <button onclick="djlight()">Start</button>


    <script>
        let clr=['1','2','3','4','5','6','7','8','9','a','b','c','d','e','f']
        const djlight=()=>{
          x='#'
          for (let i = 0; i < 6; i++) {
           n=Math.floor(Math.random()*15)
          x=x+ clr[n]
         }
           document.body.style.backgroundColor=x
           document.getElementById('dj').innerHTML=x
           setInterval(()=>{
            djlight()
        },1000)
        }
        
     
    </script>
</body>
</html>
